{% extends 'base.html' %}
{% block title %}Tambah Kandidat — E-Voting{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8">
    <h3 class="mb-4"><i class="bi bi-person-plus"></i> Tambah Kandidat — {{ election.title }}</h3>
    <div class="card">
      <div class="card-body">
        <form method="post" action="{% url 'candidates:create' election.pk %}" novalidate>
          {% csrf_token %}
          {% for field in form %}
          <div class="mb-3">
            <label for="{{ field.id_for_label }}" class="form-label">
              {{ field.label }} {% if field.field.required %}<span class="text-danger">*</span>{% endif %}
            </label>
            {{ field }}
            {% if field.errors %}<div class="text-danger small mt-1">{{ field.errors.0 }}</div>{% endif %}
          </div>
          {% endfor %}
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-success">
              <i class="bi bi-check-lg"></i> Simpan
            </button>
            <a href="{% url 'elections:detail' election.pk %}" class="btn btn-outline-secondary">Batal</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
